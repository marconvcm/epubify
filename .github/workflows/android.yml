name: Experimental Android APK
on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Android architecture
        type: choice
        default: aarch64
        options: [aarch64, x86_64]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      ANDROID_ARCH: ${{ inputs.architecture }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Native build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          build-essential autoconf automake libtool pkg-config patch git cmake ninja-build
          zip unzip perl libffi-dev libssl-dev zlib1g-dev libncurses-dev
          libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
      - run: uv sync --locked
      - name: Verify Android build configuration
        run: uv run --locked pytest tests/unit/test_android_build.py -q
      - name: Build and verify the debug APK
        run: uv run --locked python scripts/android.py apk --arch "$ANDROID_ARCH" --accept-licenses
      - name: Upload verified APK and verification report
        uses: actions/upload-artifact@v4
        with:
          name: Epubify-Android-${{ inputs.architecture }}-debug
          path: |
            dist/android/*.apk
            dist/android/*.json
          if-no-files-found: error
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Epubify-Android-${{ inputs.architecture }}-logs
          path: |
            build/android/logs/*.log
            build/android/*/.buildozer/android/platform/build-*/build/other_builds/**/config.log
          if-no-files-found: ignore
