  <title>Epubify — exemplo de layout da biblioteca</title>
  <desc>Conceito de biblioteca desktop com tema escuro, navegação lateral, pesquisa e quatro livros fictícios. As cores e a estrutura seguem a interface QML. Conteúdo meramente ilustrativo.</desc>
